# Замените server_name на свой домен и/или IP (без угловых скобок).
# Для доступа только по IP подойдёт catch-all "_" или сам IP, например: server_name 203.0.113.10;
server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    root /var/www/proffi/frontend/build;
    index index.html;

    # React static app
    location / {
        try_files $uri /index.html;
    }

    # FastAPI via reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
