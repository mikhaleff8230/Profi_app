# Пример отдельного server {} для админки на поддомене (HTTPS настройте сертификаты сами).
# Статика — из сборки Vite (папка dist). Запросы /api проксируются на тот же бэкенд, что и основной сайт.
#
#   sudo cp deploy/nginx/proffi-admin.conf /etc/nginx/sites-available/proffi-admin
#   sudo ln -sf /etc/nginx/sites-available/proffi-admin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name admin.proffi.sancan.ru;

    client_max_body_size 10M;

    root /var/www/proffi/admin/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
